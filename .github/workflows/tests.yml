name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s bridge -p "test_*.py"
      - run: python bridge/monitor.py --help
      - run: python tools/check_firmware.py
